name: Build App
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o GreeRemote.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK + AAB
        working-directory: GreeRemote
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > upload.jks; fi
          gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SplitRemote
          path: |
            GreeRemote/app/build/outputs/apk/release/*.apk
            GreeRemote/app/build/outputs/bundle/release/*.aab
